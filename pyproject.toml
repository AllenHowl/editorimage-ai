[project]
# 包名为 pedit-mcp，与视频编辑器的 vedit-mcp 保持一致。
# 包名与 MCP 服务命令相同，执行 `uvx pedit-mcp` 无需
# 指定 --from，可直接复制到任意客户端的配置中。
# Python 导入模块名仍为 pedit。
name = "pedit-mcp"
version = "0.1.0"
description = "Open-source AI image editor and MCP server: layers, masks, generative fill, image-to-image, background removal. A Photoshop/GIMP alternative an AI agent can drive, local or with your OpenAI, Gemini or Stability API key."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "image", "image-editing", "image-editor", "photo-editor", "ai-image-editor", "photoshop-alternative",
    "gimp-alternative", "photoshop", "gimp", "layers", "mcp", "mcp-server", "model-context-protocol",
    "ai-agent", "agentic-ai", "claude", "claude-code", "cursor", "background-removal", "inpainting",
    "outpainting", "generative-fill", "image-to-image", "text-to-image", "image-to-text", "upscaling",
    "comfyui", "stable-diffusion", "flux", "openai", "gpt-image", "gemini", "stability-ai", "replicate",
]
authors = [{ name = "metiu1" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "mcp>=2.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # API 请求体模型；虽然 FastAPI 会引入它，但本项目也直接导入。
    "pydantic>=2.0",
    # 合成、混合、调整和滤镜均依赖 numpy 与 Pillow，
    # 它们是编辑器核心依赖，而非可选扩展。
    "numpy>=1.24",
    "pillow>=10.0",
    # mcp_server 直接导入此包，不能仅依赖 mcp 间接安装。
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/metiutek/editorimage-ai"
Source = "https://github.com/metiutek/editorimage-ai"
Issues = "https://github.com/metiutek/editorimage-ai/issues"
Documentation = "https://github.com/metiutek/editorimage-ai#readme"
Changelog = "https://github.com/metiutek/editorimage-ai/commits/main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# 仅供使用 Anthropic 密钥的内置助手使用；
# Claude Code、OpenAI 兼容服务和 Ollama 无需此依赖。
chat = ["anthropic>=0.40"]
# 本地 AI：rembg 抠图，首次使用时下载 ONNX 模型；
# OpenCV 提供传统填充。未安装时，remove_background/select_subject
# 会提示安装方法，inpaint 则回退到 numpy 扩散填充。
ai = ["rembg>=2.0.50", "onnxruntime>=1.17", "opencv-python-headless>=4.8"]

[project.scripts]
pedit = "pedit.cli:main"
pedit-mcp = "pedit.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

# 编译后的界面随安装包分发，PyPI 用户无需 Node 编译。
# scripts/build_wheel.py 负责从 frontend/dist 复制资源。
[tool.setuptools.package-data]
pedit = ["webui/**/*", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: render grandi o modelli IA veri",
    "ai: vuole l'extra ai (rembg/opencv) installato",
]
