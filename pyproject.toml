[project]
# Il nome sul pacchetto e' "pedit-mcp", come "vedit-mcp" per l'editor video:
# coincidendo con il comando del server MCP, `uvx pedit-mcp` funziona senza
# --from, ed e' la riga che si incolla nella configurazione di qualunque client.
# Il modulo Python importabile resta `pedit`.
name = "pedit-mcp"
version = "0.1.0"
description = "Layered image editor an AI agent can actually drive (MCP), with a web UI. Layers -> pixels, non-destructive."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "image", "image-editing", "image-editor", "photo-editor", "photoshop", "gimp",
    "layers", "mcp", "model-context-protocol", "ai-agent", "claude", "claude-code",
    "background-removal", "inpainting", "generative-fill", "comfyui", "agentic-ai",
]
authors = [{ name = "metiu1" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Italian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
]
dependencies = [
    "mcp>=2.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # corpi delle richieste dell'API (arriva con fastapi, ma lo importiamo noi)
    "pydantic>=2.0",
    # il motore: composizione, fusioni, regolazioni e filtri stanno tutti su
    # numpy e Pillow. Non sono extra, sono l'editor.
    "numpy>=1.24",
    "pillow>=10.0",
    # importato direttamente da mcp_server, non solo di rimbalzo da mcp
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/metiutek/editorimage-ai"
Source = "https://github.com/metiutek/editorimage-ai"
Issues = "https://github.com/metiutek/editorimage-ai/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# serve solo per l'assistente dentro la UI con una chiave Anthropic; gli altri
# motori (Claude Code, compatibili OpenAI, Ollama) non vogliono niente
chat = ["anthropic>=0.40"]
# IA locale: scontorno (rembg, modelli onnx scaricati al primo uso) e
# riempimento classico (OpenCV). Senza, remove_background/select_subject
# dicono cosa installare e inpaint ripiega sulla diffusione in numpy.
ai = ["rembg>=2.0.50", "onnxruntime>=1.17", "opencv-python-headless>=4.8"]

[project.scripts]
pedit = "pedit.cli:main"
pedit-mcp = "pedit.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

# L'interfaccia compilata viaggia dentro il pacchetto: chi installa da PyPI non
# ha Node per compilarla. La copia scripts/build_wheel.py da frontend/dist.
[tool.setuptools.package-data]
pedit = ["webui/**/*", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: render grandi o modelli IA veri",
    "ai: vuole l'extra ai (rembg/opencv) installato",
]
