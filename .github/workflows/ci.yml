# 每次推送和提交拉取请求时运行测试。
#
# 发布流程也会通过 `workflow_call` 调用此工作流，
# 确保发布到 PyPI 的版本已经通过这些检查。
name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: dipendenze
        run: python -m pip install -e ".[dev]"

      - name: doctor
        run: pedit doctor

      - name: test
        run: pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: dipendenze
        working-directory: frontend
        run: npm ci

      # 界面测试会加载编译后的包，因此先构建界面。
      - name: compila
        working-directory: frontend
        run: npm run build

      - name: test
        working-directory: frontend
        run: npm test
